# Android workbench (android/): build on every push that touches it; the
# emulator golden-replay job is manual-dispatch only (20+ min of emulator
# boot + three analyses — same reasoning as windows-build.yml: heavy
# artifacts never gate every push).  The bridge's Python contract is
# covered on every push by tests/test_android_bridge.py in ci.yml.
name: android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: assembleDebug
        working-directory: android
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wifitrx-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  golden:
    # on-device physics check: gradle :app:connectedDebugAndroidTest
    # against androidTest/assets/golden.json (desktop-generated).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: android
          script: gradle :app:connectedDebugAndroidTest
