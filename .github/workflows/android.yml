# Android workbench (android/): build on every push that touches it; the
# emulator golden-replay job is manual-dispatch only (20+ min of emulator
# boot + three analyses — same reasoning as windows-build.yml: heavy
# artifacts never gate every push).  The bridge's Python contract is
# covered on every push by tests/test_android_bridge.py in ci.yml.
name: android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: assembleDebug
        working-directory: android
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wifitrx-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  golden:
    # on-device physics check: gradle :app:connectedDebugAndroidTest
    # against androidTest/assets/golden.json (desktop-generated).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: android
          script: gradle :app:connectedDebugAndroidTest

      # A green job is not proof that the on-device guards ran: a test
      # that never executes, or is skipped, leaves the build successful
      # and the guard imaginary.  The count used to be checked by reading
      # the gradle output by hand; the job asserts it here instead, and
      # prints the roster where the end of the log always reaches it.
      - name: on-device tests actually ran
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = glob.glob("android/app/build/outputs/androidTest-results/"
                            "connected/**/*.xml", recursive=True)
          if not files:
              sys.exit("no instrumented test results were written at all")
          total = failed = skipped = 0
          names = []
          for path in files:
              suite = ET.parse(path).getroot()
              total += int(suite.get("tests", 0))
              failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
              skipped += int(suite.get("skipped", 0))
              for case in suite.iter("testcase"):
                  names.append(f"{case.get('classname')}.{case.get('name')}")
          print(f"on-device tests: {total} run, {failed} failed, "
                f"{skipped} skipped")
          for name in sorted(names):
              print("  -", name)
          # exact, not a floor: ">= 4" still passes if a new test is added
          # while one of the old ones quietly stops running.  This job runs
          # a single AVD, so the count is the test count.
          expected = 4
          if total != expected:
              sys.exit(f"expected exactly {expected} on-device tests, ran "
                       f"{total} — update this number when adding one")
          if failed or skipped:
              sys.exit("on-device tests failed or were skipped")
          PY
