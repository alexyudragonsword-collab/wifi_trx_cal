# One interpreter, two lanes: a fast lane on every push and a scheduled
# full run.  Deliberately NOT a 5-job OS/Python matrix running everything
# everywhere — the sibling-project post-mortem priced that pattern: the
# guard tests (layering, dead knobs, cal ordering) catch the decay classes
# that matter, and they run in seconds.
name: ci

on:
  push:
  schedule:
    - cron: "0 18 * * *"   # daily full run (02:00 UTC+8)
  # on demand: the full lane (coverage floor, docs staleness, schematic
  # check) used to be reachable only by waiting for the nightly, so a red
  # nightly could not be re-adjudicated the same day
  workflow_dispatch:

# a newer push on the same branch supersedes a running fast lane
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both lanes run the scripts under scripts/ so the local gate and the CI
  # gate are one command; they had drifted apart (health check 2026-09-08:
  # this file linted and the script did not, the nightly script ran
  # examples this file never did).
  fast:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Qt offscreen system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglib2.0-0 libxkbcommon0
      - run: pip install -e .[test,gui,docs,dev]
      - name: fast lane (lint + guards + unit + GUI offscreen, with coverage)
        run: scripts/ci_fast.sh

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Qt offscreen system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglib2.0-0 libxkbcommon0
      - run: pip install -e .[test,gui,docs,dev]
      - name: full lane (lint, slow cases, coverage floor, docs and assets staleness)
        run: scripts/ci_nightly.sh
