# One interpreter, two lanes: a fast lane on every push and a scheduled
# full run.  Deliberately NOT a 5-job OS/Python matrix running everything
# everywhere — the sibling-project post-mortem priced that pattern: the
# guard tests (layering, dead knobs, cal ordering) catch the decay classes
# that matter, and they run in seconds.
name: ci

on:
  push:
  schedule:
    - cron: "0 18 * * *"   # daily full run (02:00 UTC+8)

jobs:
  fast:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt offscreen system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglib2.0-0 libxkbcommon0
      - run: pip install -e .[test,gui,docs,dev]
      - name: lint (pycodestyle + pyflakes)
        run: ruff check src/ app/ tests/ tools/ examples/
      - name: fast lane (guards + unit + GUI offscreen)
        run: QT_QPA_PLATFORM=offscreen python -m pytest tests/ -m "not slow" -q

  full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt offscreen system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglib2.0-0 libxkbcommon0
      - run: pip install -e .[test,gui,docs,dev]
      - name: lint
        run: ruff check src/ app/ tests/ tools/ examples/
      - name: full suite (slow included) with coverage
        run: >
          QT_QPA_PLATFORM=offscreen python -m pytest tests/ -q
          --cov --cov-report=term:skip-covered --cov-report=xml
      # The committed HTML is a deliverable, and nothing else notices when
      # it falls behind the code it is generated from.  A rebuild is
      # byte-identical apart from the provenance stamp (the schematics
      # strip matplotlib's per-run timestamp and clip ids), so any other
      # difference means the committed copy is stale.
      - name: committed docs match a fresh build
        run: |
          QT_QPA_PLATFORM=offscreen MPLBACKEND=Agg \
            python tools/build_docs.py --out docs/
          python - <<'PY'
          import re, subprocess, sys
          stamp = re.compile(r"\d{4}-\d\d-\d\dT[\d:+\-]+")
          for name in ("docs/tutorial.html", "docs/devguide.html"):
              old = subprocess.run(["git", "show", f"HEAD:{name}"],
                                   capture_output=True, text=True).stdout
              new = open(name, encoding="utf-8").read()
              if stamp.sub("", old) != stamp.sub("", new):
                  sys.exit(f"{name} is stale: rebuild with "
                           f"python tools/build_docs.py --out docs/")
          print("committed docs are current")
          PY
      - name: schematic assets match their generator
        run: MPLBACKEND=Agg python tools/build_assets.py --check
