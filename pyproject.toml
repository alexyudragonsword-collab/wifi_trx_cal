[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wifitrx"
version = "0.7.24"
description = "WiFi 7 direct-conversion IQ transceiver behavioral model and calibration suite (320 MHz)"
readme = "README.md"
requires-python = ">=3.10"
# Desktop floors.  The Android APK runs the same package on Chaquopy's
# CPython 3.8 with numpy 1.19.5 / scipy 1.4.1 / matplotlib 3.6.0 — below
# these — and is kept working by the call-surface allow-lists in
# tests/test_android_bridge.py plus the on-device golden job, not by
# this metadata.  See cairn/Android出货线.md.
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]
gui = ["PySide6>=6.6"]
# schemdraw is pinned: its SVG output format is the committed
# assets/schematics artifact, and 0.24 may change it under us
docs = ["schemdraw>=0.23,<0.24"]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running end-to-end tests (deselect with '-m \"not slow\"')",
]

[tool.ruff]
# The convention in code is ~79 columns; the enforced ceiling is 100
# because the docstrings carry the physics and the tutorial's section
# titles carry a Chinese and an English string side by side — reflowing
# those to 79 costs readability and buys nothing.
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
# pycodestyle + pyflakes only: the value here is catching the unused
# import, the shadowed name, the leftover variable — not restyling code
# that four guard tests already constrain
select = ["E", "F", "W"]

[tool.coverage.run]
# the library and the data layer both front-ends ship (the analysis
# registry, inspector content, reference tables) — app/specs.py goes into
# the APK and was never measured before 0.7.19
source = ["wifitrx", "app"]
omit = ["*/__main__.py",   # measured through subprocess, not import
        "app/main.py"]     # the Qt window itself: built offscreen by tests, not measured

[tool.coverage.report]
# baseline at the time the gate went in was 88 %; the floor exists to
# catch a module arriving with no test at all, not to chase 100 %
fail_under = 85
skip_covered = false
