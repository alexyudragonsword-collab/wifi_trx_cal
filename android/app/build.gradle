plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.chaquo.python"
}

android {
    namespace "com.wifitrx.workbench"
    compileSdk 34

    defaultConfig {
        applicationId "com.wifitrx.workbench"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.7.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // arm64 for devices, x86_64 for the emulator/CI golden tests.
            // Each ABI adds ~80 MB of CPython+numpy+scipy — do not widen.
            abiFilters "arm64-v8a", "x86_64"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildTypes {
        release {
            minifyEnabled false       // Python assets dominate size anyway
        }
    }
    // Two ways to ship the same app.  `interpreted` is the default and
    // what every existing job builds; `compiled` swaps the wifitrx source
    // for per-ABI wheels whose modules are .so (see android/tools/).
    flavorDimensions "code"
    productFlavors {
        interpreted { dimension "code" }
        compiled { dimension "code" }
    }
}

chaquopy {
    defaultConfig {
        // 3.8, not 3.11: probed by CI run 32612946416 — the Chaquopy
        // wheel repository has NO scipy build for cp311 ("from versions:
        // none"); its scientific stack is richest at 3.8, exactly as the
        // configure-time warning says.  The whole source tree is 3.8-safe
        // (audited: `from __future__ import annotations` everywhere that
        // needs it, no match statements, no runtime generics, no 3.9+
        // stdlib calls).
        version "3.8"
        pip {
            // Wheels only: without this, pip resolves scipy to the newest
            // PyPI *sdist* (no Android wheel) and dies trying to compile
            // it (run 32608953586: "meson executable not found").  Bare
            // names, not the pyproject floors: cp38 Android wheels are
            // older than the desktop floors — resolution lands on the
            // newest wheel that exists, the build log reports which, and
            // the on-device golden test is what proves the physics still
            // matches the desktop.  Record resolved versions in
            // android/README.md.
            options "--only-binary", ":all:"
            install "numpy"
            install "scipy"
            install "matplotlib"
        }
    }
    productFlavors {
        compiled {
            pip {
                // Wheels by tag, never by path: this build produces one
                // wheel per ABI and only --find-links makes pip choose
                // between them.  Installing a wheel by path skips tag
                // matching and puts the arm64 wheel in the x86_64 variant
                // too — it installs cleanly and fails at import.
                // merged with defaultConfig's block, so numpy/scipy/
                // matplotlib are already asked for — only wifitrx and the
                // link to its wheels are added here
                options "--find-links", file("pysrc").absolutePath
                install "wifitrx"
            }
        }
    }
    sourceSets {
        main {
            // bridge.py (src/main/python) + the unmodified analysis layer:
            // repo app/ provides the declarative registry (specs.py,
            // reference.py).  main.py and the Qt pages ride along
            // unimported — PySide6 is never imported on-device.
            // build/python-assets carries the repo's assets/ tree (see the
            // stageAssets task below): the Reference tab reads the shipped
            // schematic SVGs off the filesystem, so they must travel with
            // the Python sources, not only as Android assets.
            srcDirs = ["src/main/python", "../../app", "build/python-assets"]
        }
        // wifitrx as source, for the interpreted flavor only.  It must NOT
        // appear for `compiled`: a source dir takes import precedence over
        // site-packages, so the .py would shadow every .so and the build
        // would ship an interpreted APK that looks compiled.
        interpreted {
            srcDirs = ["../../src"]
        }
    }
}

// Stage the repo's assets/ into a Chaquopy source dir, so the tree lands
// as <python-root>/assets/... — the layout app/reference.py's asset_path
// falls back to on Android.  A Sync (not Copy) keeps deletions honest.
tasks.register("stageAssets", Sync) {
    from "../../assets"
    into layout.buildDirectory.dir("python-assets/assets")
}
tasks.matching { it.name.startsWith("generate") && it.name.contains("Python") }
     .configureEach { dependsOn "stageAssets" }
tasks.matching { it.name.startsWith("merge") && it.name.contains("Python") }
     .configureEach { dependsOn "stageAssets" }

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.webkit:webkit:1.12.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
}
